<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#0b1120"/>
  <text x="450" y="40" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Flujo de red · Tailscale subnet router</text>

  <!-- Laptop -->
  <rect x="40" y="180" width="180" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="215" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">PORTÁTIL</text>
  <text x="130" y="238" fill="#94a3b8" font-size="11" text-anchor="middle">usuario de la tailnet</text>
  <text x="130" y="258" fill="#38bdf8" font-size="11" text-anchor="middle">100.x.y.z</text>

  <!-- Tailscale cloud -->
  <rect x="300" y="170" width="200" height="120" rx="60" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="215" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">TAILNET</text>
  <text x="400" y="238" fill="#bae6fd" font-size="11" text-anchor="middle">cifrado WireGuard</text>
  <text x="400" y="258" fill="#7dd3fc" font-size="11" text-anchor="middle">MagicDNS + ACLs</text>

  <!-- homelab node -->
  <rect x="590" y="170" width="220" height="120" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="700" y="205" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">homelab</text>
  <text x="700" y="228" fill="#99f6e4" font-size="11" text-anchor="middle">subnet router</text>
  <text x="700" y="248" fill="#5eead4" font-size="11" text-anchor="middle">ip_forward = 1</text>
  <text x="700" y="270" fill="#2dd4bf" font-size="11" text-anchor="middle">anuncia 10.10.0.0/16</text>

  <!-- arrows -->
  <line x1="220" y1="230" x2="300" y2="230" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
  <line x1="500" y1="230" x2="590" y2="230" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>

  <!-- Bottom networks -->
  <rect x="90" y="370" width="320" height="90" rx="10" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="250" y="402" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">DOCKER · 10.10.0.0/16</text>
  <text x="250" y="424" fill="#bfdbfe" font-size="11" text-anchor="middle">AD · GLPI · NFS · Grafana</text>
  <text x="250" y="444" fill="#93c5fd" font-size="11" text-anchor="middle">DNS: 10.10.0.10</text>

  <rect x="490" y="370" width="320" height="90" rx="10" fill="#3f6212" stroke="#a3e635"/>
  <text x="650" y="402" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">LAN FÍSICA · 192.168.1.0/24</text>
  <text x="650" y="424" fill="#d9f99d" font-size="11" text-anchor="middle">equipos a imagenar</text>
  <text x="650" y="444" fill="#bef264" font-size="11" text-anchor="middle">Clonezilla Live via USB</text>

  <line x1="660" y1="290" x2="300" y2="370" stroke="#2dd4bf" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="290" x2="660" y2="370" stroke="#a3e635" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="495" fill="#475569" font-size="11" text-anchor="middle">Sin port forwarding · sin IP pública · acceso por identidad (ACLs por grupo)</text>
</svg>
