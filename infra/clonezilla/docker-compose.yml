# Repositorio NFS de imagenes Clonezilla.
# Uso: docker compose --env-file ../../.env -f docker-compose.yml up -d
name: homelab-clonezilla

networks:
  homelab_net:
    name: homelab_homelab_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16

volumes:
  images-data:
    name: homelab_images-data

services:
  images:
    image: erichough/nfs-server:2.2.1
    container_name: homelab-images
    restart: unless-stopped
    environment:
      NFS_EXPORT_0: /srv/clonezilla/images ${DOCKER_SUBNET:-10.10.0.0/16}(rw,sync,no_subtree_check,no_root_squash,fsid=0) ${LAN_SUBNET:-192.168.0.0/24}(rw,sync,no_subtree_check,no_root_squash,fsid=0)
      # NFSv4 evita rpc.statd, que fallaba en este host con poca RAM.
      NFS_DISABLE_VERSION_3: "1"
    cap_add: [SYS_ADMIN, NET_ADMIN]
    privileged: true  # necesario para montar rpc_pipefs y arrancar nfsd
    volumes:
      - images-data:/srv/clonezilla/images
    networks:
      homelab_net:
        ipv4_address: 10.10.0.30
    ports:
      - "127.0.0.1:2049:2049"
      - "127.0.0.1:111:111/tcp"
      - "127.0.0.1:111:111/udp"
