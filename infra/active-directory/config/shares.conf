# ============================================================
# Compartidos añadidos por provision-ad.sh al smb.conf generado.
# Los permisos efectivos se aplican con setfacl sobre SIDs (ver script).
# ============================================================

[soporte]
   path = /srv/shares/soporte
   read only = No
   browseable = Yes
   comment = Recursos del equipo de soporte

[usuarios]
   path = /srv/shares/usuarios
   read only = No
   browseable = Yes
   comment = Recursos compartidos de usuarios

[invitados]
   path = /srv/shares/invitados
   read only = Yes
   browseable = Yes
   comment = Solo lectura para invitados
