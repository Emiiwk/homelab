# Referencia del smb.conf final tras aprovisionar.
# No se monta directamente: samba-tool domain provision genera el archivo real
# y provision-ad.sh añade los compartidos desde shares.conf.

[global]
   workgroup = HOMELAB
   realm = HOMELAB.LOCAL
   netbios name = DC01
   server role = active directory domain controller
   server services = -dns? (se usa SAMBA_INTERNAL)
   dns forwarder = 1.1.1.1
   idmap_ldb:use rfc2307 = yes
   allow dns updates = nonsecure and secure
   tls enabled = no
   log file = /var/log/samba/log.%m
   max log size = 1000

[netlogon]
   path = /var/lib/samba/sysvol/homelab.local/scripts
   read only = No

[sysvol]
   path = /var/lib/samba/sysvol
   read only = No

# Los compartidos [soporte], [usuarios] e [invitados] se append automaticamente.
