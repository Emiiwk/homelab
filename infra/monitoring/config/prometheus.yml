global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: homelab
    project: homelab

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: glpi
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.0.20:80"]
